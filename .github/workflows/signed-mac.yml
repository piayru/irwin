name: Signed macOS update candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    # Maintainers should protect this environment with required reviewers.
    environment: macos-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: node node_modules/electron/install.js
      - name: Stage both macOS architectures
        run: |
          pnpm tools:fetch mac-x64
          pnpm tools:fetch mac-arm64
      - run: pnpm release:preflight
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build, sign, notarize, and verify before archiving
        run: pnpm package --publish never
        env:
          IRWIN_SIGNED_MAC_RELEASE: "1"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify both macOS bundles
        run: |
          node scripts/verify-package.mjs --unpacked release/mac/Irwin.app
          node scripts/verify-package.mjs --unpacked release/mac-arm64/Irwin.app
          node scripts/verify-update-metadata.mjs --platform darwin
          pnpm release:manifest
      - uses: actions/upload-artifact@v4
        with:
          name: irwin-signed-mac-candidate
          if-no-files-found: error
          path: |
            release/Irwin-*.dmg
            release/Irwin-*.zip
            release/Irwin-*.blockmap
            release/latest-mac.yml
            release/release-manifest.json
