allowBuilds:
  electron: true
  esbuild: true
  ssh2: true
  electron-winstaller: false
  macos-export-certificate-and-key: false
  cpu-features: false
  win-export-certificate-and-key: false
  kerberos: false
  mongodb-client-encryption: false
  mongodb-memory-server: false
overrides:
  # GHSA-c475-qrg2-pj4r: mongosh's PAC proxy dependency must use the fixed parser.
  basic-ftp: 6.2.1
  # GHSA-jqcg-44mw-7w3h: fix mongosh's indirect proxy trust dependency.
  proxy-addr: 2.0.8
  dompurify: 3.4.17
  # Keep mongosh's proxy and OIDC dependencies on patched versions.
  ip-address: 10.7.4
  body-parser@^2: 2.4.0
  qs: 6.16.1
  uuid: 11.1.1
  # ExcelJS's old ZIP reader pulls in packages without complete license notices.
  "exceljs>unzipper": 0.12.5
  # The optional addon was never built; mongosh uses the driver's DNS fallback.
  "@mongodb-js/devtools-connect>os-dns-native": "-"
